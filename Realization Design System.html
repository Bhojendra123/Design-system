  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3dcbebe4-ca56-4905-a09b-9a5a41839606\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2992597f-21c8-4413-91e0-55e94b90025a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8dc29db1-b4c9-45b4-a54c-da7ecfd6218b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---- Ink ---------------------------------------------------------- */\n  --ink-900: #0E0D0A;   /* dark bands, statement cards */\n  --ink-800: #17160F;   /* headings, dark buttons, table header */\n  --ink-600: #4A483F;   /* lead body, nav links */\n  --ink-500: #5D5B52;   /* body */\n  --ink-400: #6B6960;   /* small body, card copy */\n  --ink-300: #8A887F;   /* meta, tagline */\n  --ink-200: #9A9890;   /* labels, citations */\n\n  /* ---- Surfaces ----------------------------------------------------- */\n  --surface-page: #F7F6F3;\n  --surface-card: #FFFFFF;\n  --surface-sunken: #FBFAF8;\n  --surface-dark: #0E0D0A;\n  --surface-dark-raised: rgba(255, 255, 255, 0.05);\n\n  /* ---- Borders ------------------------------------------------------ */\n  --border-soft: #E7E4DD;\n  --border-strong: #DFDCD4;\n  --border-row: #EAE7E0;\n  --border-on-dark: rgba(255, 255, 255, 0.14);\n\n  /* ---- Accent: signal orange ---------------------------------------- */\n  --accent-500: #E2521E;\n  --accent-600: #C4400F;   /* hover */\n  --accent-700: #B93C11;   /* link hover */\n  --accent-text: #B0432A;  /* orange text on light surfaces */\n  --accent-border: #E9BCA6;\n  --accent-wash: rgba(226, 82, 30, 0.10);\n\n  /* ---- Accent: caution yellow (dark surfaces + brand strip) --------- */\n  --signal-500: #F2B705;\n  --signal-ink: #3A3208;\n  --signal-wash: rgba(242, 183, 5, 0.35); /* quote highlight */\n\n  /* ---- Ambient tint -------------------------------------------------- */\n  --tint-green: rgba(120, 190, 150, 0.12);\n\n  /* ---- Text on dark -------------------------------------------------- */\n  --on-dark-100: #FFFFFF;\n  --on-dark-75: rgba(255, 255, 255, 0.75);\n  --on-dark-68: rgba(255, 255, 255, 0.68);\n  --on-dark-62: rgba(255, 255, 255, 0.62);\n\n  /* ---- Semantic aliases --------------------------------------------- */\n  --text-heading: var(--ink-800);\n  --text-lead: var(--ink-600);\n  --text-body: var(--ink-500);\n  --text-small: var(--ink-400);\n  --text-meta: var(--ink-200);\n  --text-eyebrow: var(--accent-500);\n  --text-eyebrow-dark: var(--signal-500);\n  --text-link: var(--accent-500);\n  --text-link-hover: var(--accent-700);\n}\n\n:root {\n  --font-display: \"Manrope\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --font-text: \"Public Sans\", Helvetica, Arial, sans-serif;\n  --font-quote: Georgia, \"Times New Roman\", serif;\n\n  /* weights actually in use */\n  --weight-light: 300;\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-black: 800;\n\n  /* display scale (Manrope, tight tracking) */\n  --size-h1: 46px;        --lh-h1: 1.1;    --track-h1: -0.03em;\n  --size-h2: 27px;        --lh-h2: 1.2;    --track-h2: -0.025em;\n  --size-h2-sm: 26px;     --lh-h2-sm: 1.22;\n  --size-statement: 22px; --lh-statement: 1.25;\n  --size-card-lead: 19px;\n  --size-equation: 36px;  --track-equation: -0.04em;\n\n  /* text scale (Public Sans) */\n  --size-hero-body: 14.5px;\n  --size-lead: 14px;\n  --size-body: 13.5px;\n  --size-nav: 12.5px;\n  --size-small: 12.5px;\n  --size-fine: 12px;\n  --size-micro: 11.5px;\n\n  /* labels */\n  --size-eyebrow: 10px;      --track-eyebrow: 0.2em;\n  --size-eyebrow-lg: 10.5px; --track-eyebrow-lg: 0.22em;\n  --size-tablehead: 9.5px;   --track-tablehead: 0.18em;\n  --track-wordmark: 0.34em;\n  --track-wordmark-sm: 0.32em;\n\n  /* line heights */\n  --lh-prose: 1.8;\n  --lh-tight-prose: 1.75;\n  --lh-compact: 1.7;\n}\n\n:root {\n  --space-1: 2px;\n  --space-2: 6px;\n  --space-3: 7px;\n  --space-4: 10px;\n  --space-5: 12px;\n  --space-6: 14px;\n  --space-7: 16px;\n  --space-8: 18px;\n  --space-9: 20px;\n  --space-10: 22px;\n  --space-11: 24px;\n  --space-12: 26px;\n  --space-13: 30px;\n  --space-14: 34px;\n  --space-15: 40px;\n  --space-16: 48px;\n  --space-17: 56px;\n  --space-18: 70px;\n  --space-19: 78px;\n  --space-20: 88px;\n\n  /* layout */\n  --container: 1000px;\n  --container-prose: 880px;\n  --measure-hero: 680px;\n  --measure-prose: 820px;\n  --measure-heading: 660px;\n  --page-gutter: 40px;\n  --section-y: 78px;\n  --band-y: 70px;\n  --header-y: 14px;\n  --grid-gap: 16px;\n  --grid-gap-tight: 12px;\n  --sticky-offset: 90px;\n}\n\n:root {\n  --radius-xs: 4px;\n  --radius-sm: 5px;\n  --radius-md: 6px;\n  --radius-lg: 8px;\n  --radius-xl: 10px;\n  --radius-2xl: 12px;\n  --radius-pill: 999px;\n\n  --border-hairline: 1px;\n  --border-accent-edge: 3px;\n\n  --shadow-card: 0 18px 50px rgba(23, 22, 15, 0.05);\n  --shadow-accent: 0 20px 60px rgba(226, 82, 30, 0.08);\n\n  --ease-ui: cubic-bezier(0.4, 0, 0.2, 1);\n  --duration-ui: 0.18s;\n\n  /* ambient section washes */\n  --wash-hero:\n    radial-gradient(60% 70% at 88% 4%, var(--accent-wash), transparent 60%),\n    radial-gradient(50% 60% at 6% 30%, var(--tint-green), transparent 60%),\n    var(--surface-page);\n  --wash-right:\n    radial-gradient(45% 60% at 92% 20%, var(--accent-wash), transparent 62%),\n    var(--surface-card);\n}\n\n/* Element layer — the literal visual vocabulary of the Realization pages.\n   Every rule here is lifted from the capital-project-delays page; values are\n   exact, not rounded. Consumers may use these classes directly or copy the\n   declarations inline. */\n\nbody.rz-page {\n  margin: 0;\n  background: var(--surface-page);\n  color: var(--text-heading);\n  font-family: var(--font-text);\n  -webkit-font-smoothing: antialiased;\n}\n.rz-page a { color: var(--text-link); text-decoration: none; }\n.rz-page a:hover { color: var(--text-link-hover); }\n\n/* ---- Labels --------------------------------------------------------- */\n.rz-eyebrow {\n  font-size: var(--size-eyebrow);\n  font-weight: var(--weight-bold);\n  letter-spacing: var(--track-eyebrow);\n  text-transform: uppercase;\n  color: var(--text-eyebrow);\n}\n.rz-eyebrow--lg { font-size: var(--size-eyebrow-lg); letter-spacing: var(--track-eyebrow-lg); }\n.rz-eyebrow--dark { color: var(--text-eyebrow-dark); }\n.rz-eyebrow--muted { color: var(--text-meta); }\n\n/* ---- Headings ------------------------------------------------------- */\n.rz-h1, .rz-h2, .rz-statement, .rz-card-title, .rz-card-lead {\n  font-family: var(--font-display);\n  margin: 0;\n}\n.rz-h1 { font-size: var(--size-h1); line-height: var(--lh-h1); letter-spacing: var(--track-h1); font-weight: var(--weight-bold); text-wrap: balance; }\n.rz-h2 { font-size: var(--size-h2); line-height: var(--lh-h2); letter-spacing: var(--track-h2); font-weight: var(--weight-bold); }\n.rz-statement { font-size: var(--size-statement); line-height: var(--lh-statement); letter-spacing: var(--track-h2); font-weight: var(--weight-bold); }\n.rz-card-lead { font-size: var(--size-card-lead); font-weight: var(--weight-bold); letter-spacing: -0.02em; }\n.rz-card-title { font-size: 14px; font-weight: var(--weight-bold); color: var(--text-heading); }\n.rz-card-title--sm { font-size: 13.5px; }\n.rz-card-title--xs { font-size: 13px; }\n\n/* ---- Prose ---------------------------------------------------------- */\n.rz-lead  { font-size: var(--size-lead); line-height: var(--lh-prose); color: var(--text-lead); font-weight: var(--weight-light); margin: 0 0 14px; }\n.rz-body  { font-size: var(--size-body); line-height: var(--lh-prose); color: var(--text-body); font-weight: var(--weight-light); margin: 0 0 14px; }\n.rz-small { font-size: var(--size-small); line-height: var(--lh-tight-prose); color: var(--text-small); font-weight: var(--weight-light); }\n.rz-fine  { font-size: var(--size-fine); line-height: var(--lh-compact); color: var(--text-small); font-weight: var(--weight-light); }\n.rz-meta  { font-size: var(--size-micro); color: var(--text-meta); }\n.rz-prose { max-width: var(--measure-prose); text-wrap: pretty; }\n\n/* ---- Buttons -------------------------------------------------------- */\n.rz-btn {\n  display: inline-block;\n  font-family: var(--font-text);\n  font-size: var(--size-nav);\n  font-weight: var(--weight-semibold);\n  padding: 10px 18px;\n  border-radius: var(--radius-sm);\n  border: 1px solid transparent;\n  cursor: pointer;\n  transition: background var(--duration-ui) var(--ease-ui), border-color var(--duration-ui) var(--ease-ui);\n}\na.rz-btn--primary, .rz-btn--primary { background: var(--accent-500); color: var(--on-dark-100); }\na.rz-btn--primary:hover, .rz-btn--primary:hover { background: var(--accent-600); color: var(--on-dark-100); }\na.rz-btn--secondary, .rz-btn--secondary { background: var(--surface-card); color: var(--accent-500); border-color: var(--accent-border); }\na.rz-btn--secondary:hover, .rz-btn--secondary:hover { border-color: var(--accent-500); color: var(--accent-500); }\na.rz-btn--dark, .rz-btn--dark { background: var(--ink-800); color: var(--on-dark-100); padding: 9px 16px; border-radius: var(--radius-md); font-size: 12px; }\na.rz-btn--dark:hover, .rz-btn--dark:hover { background: #000000; color: var(--on-dark-100); }\n.rz-btn--lg { padding: 11px 20px; }\n.rz-btn[disabled], .rz-btn--disabled { opacity: 0.45; pointer-events: none; }\n\n/* ---- Tag pill ------------------------------------------------------- */\n.rz-tag {\n  display: inline-block;\n  border: 1px solid var(--border-strong);\n  background: var(--surface-card);\n  border-radius: var(--radius-pill);\n  padding: 6px 14px;\n  font-size: var(--size-micro);\n  color: var(--text-body);\n}\n\n/* ---- Numbered marker ------------------------------------------------ */\n.rz-marker {\n  flex: none;\n  width: 24px; height: 24px;\n  border-radius: 50%;\n  background: var(--ink-800);\n  color: var(--on-dark-100);\n  font-size: 11px; font-weight: var(--weight-bold);\n  display: flex; align-items: center; justify-content: center;\n}\n.rz-marker--sm { width: 22px; height: 22px; font-size: 10.5px; }\n.rz-marker--signal { background: var(--signal-500); color: var(--ink-800); }\n\n/* ---- Cards ---------------------------------------------------------- */\n.rz-card { background: var(--surface-card); border: 1px solid var(--border-soft); border-radius: var(--radius-2xl); padding: 26px; }\n.rz-card--elevated { box-shadow: var(--shadow-card); }\n.rz-card--accent-shadow { box-shadow: var(--shadow-accent); }\n.rz-card--outline { border: 1px solid var(--border-strong); border-radius: var(--radius-xl); padding: 22px 24px; }\n.rz-card--sunken { background: var(--surface-sunken); border: 1px solid var(--border-strong); border-radius: var(--radius-xl); padding: 22px 24px; }\n.rz-card--accent-edge { border-radius: var(--radius-lg); border: 1px solid var(--border-soft); border-left: var(--border-accent-edge) solid var(--accent-500); padding: 20px 22px; }\n.rz-card--statement { background: var(--surface-dark); color: var(--on-dark-100); border: none; border-radius: var(--radius-xl); padding: 28px 26px; }\n.rz-card--on-dark { background: var(--surface-dark-raised); border: 1px solid var(--border-on-dark); border-radius: var(--radius-xl); padding: 22px 24px; color: var(--on-dark-100); }\n\n/* ---- Status row (WIP list) ------------------------------------------ */\n.rz-status {\n  display: flex; justify-content: space-between; gap: 14px;\n  padding: 9px 12px;\n  background: var(--surface-page);\n  border-left: var(--border-accent-edge) solid var(--accent-500);\n  border-radius: var(--radius-xs);\n  font-size: var(--size-fine);\n}\n.rz-status__label { font-weight: var(--weight-semibold); color: var(--text-heading); }\n.rz-status__state { color: var(--accent-text); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }\n\n/* ---- Table ---------------------------------------------------------- */\n.rz-table { border: 1px solid var(--border-strong); border-radius: var(--radius-xl); overflow: hidden; }\n.rz-table__row { display: grid; grid-template-columns: 0.9fr 1.1fr; }\n.rz-table__head { background: var(--ink-800); color: var(--on-dark-100); }\n.rz-table__head > div { padding: 12px 18px; font-size: var(--size-tablehead); font-weight: var(--weight-bold); letter-spacing: var(--track-tablehead); text-transform: uppercase; }\n.rz-table__row + .rz-table__row { border-top: 1px solid var(--border-row); }\n.rz-table__row--odd { background: var(--surface-card); }\n.rz-table__row--even { background: var(--surface-sunken); }\n.rz-table__cell-key { padding: 16px 18px; font-family: var(--font-display); font-size: var(--size-small); font-weight: var(--weight-bold); color: var(--text-heading); }\n.rz-table__cell-val { padding: 16px 18px; font-size: var(--size-fine); line-height: var(--lh-tight-prose); color: var(--text-small); font-weight: var(--weight-light); }\n\n/* ---- Accordion ------------------------------------------------------ */\n.rz-accordion { display: grid; gap: 10px; }\n.rz-accordion__item { border: 1px solid var(--border-soft); border-radius: var(--radius-lg); background: var(--surface-card); overflow: hidden; }\n.rz-accordion__summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 20px; }\n.rz-accordion__summary::-webkit-details-marker { display: none; }\n.rz-accordion__summary:hover { background: var(--surface-sunken); }\n.rz-accordion__q { font-family: var(--font-display); font-size: 13.5px; font-weight: var(--weight-semibold); color: var(--text-heading); }\n.rz-accordion__sign { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border-strong); color: var(--ink-300); font-size: 14px; display: flex; align-items: center; justify-content: center; transition: transform var(--duration-ui) var(--ease-ui); }\n.rz-accordion__item[open] .rz-accordion__sign { transform: rotate(45deg); }\n.rz-accordion__a { padding: 0 20px 18px; font-size: var(--size-small); line-height: var(--lh-prose); color: var(--text-small); font-weight: var(--weight-light); max-width: 720px; }\n\n/* ---- Quote ---------------------------------------------------------- */\n.rz-quote { font-family: var(--font-quote); font-size: 14.5px; line-height: 1.7; color: #3B3A33; }\n.rz-quote__title { font-family: var(--font-quote); font-size: 17px; line-height: 1.3; color: var(--text-heading); }\n.rz-quote mark, .rz-mark { background: var(--signal-wash); padding: 1px 3px; color: inherit; }\n\n/* ---- Equation ------------------------------------------------------- */\n.rz-equation { font-family: var(--font-display); font-size: var(--size-equation); font-weight: var(--weight-black); letter-spacing: var(--track-equation); color: var(--text-heading); }\n.rz-equation em { font-style: normal; color: var(--accent-500); }\n\n/* ---- Structure ------------------------------------------------------ */\n.rz-section { padding: var(--section-y) var(--page-gutter); background: var(--surface-page); }\n.rz-section--light { background: var(--surface-card); }\n.rz-section--dark { background: var(--surface-dark); color: var(--on-dark-100); }\n.rz-section--hero { background: var(--wash-hero); padding: 72px var(--page-gutter) var(--space-20); overflow: hidden; }\n.rz-container { max-width: var(--container); margin: 0 auto; }\n.rz-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--grid-gap); }\n.rz-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--grid-gap); }\n.rz-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--grid-gap-tight); }\n\n/* ---- Header / footer / strip ---------------------------------------- */\n.rz-header { background: var(--surface-card); border-bottom: 1px solid var(--border-soft); padding: var(--header-y) var(--page-gutter); display: flex; align-items: center; justify-content: space-between; gap: var(--space-11); position: sticky; top: 0; z-index: 20; }\n.rz-wordmark { font-family: var(--font-display); font-weight: var(--weight-black); font-size: 15px; letter-spacing: var(--track-wordmark); color: var(--text-heading); }\n.rz-tagline { font-size: 7.5px; letter-spacing: var(--track-eyebrow); color: var(--ink-300); text-transform: uppercase; }\n.rz-nav { display: flex; align-items: center; gap: var(--space-12); font-size: var(--size-nav); }\n.rz-nav a:not([class*=\"rz-btn\"]) { color: var(--ink-600); white-space: nowrap; }\n.rz-nav a:not([class*=\"rz-btn\"]):hover { color: var(--text-heading); }\n.rz-footer { background: var(--surface-card); border-top: 1px solid var(--border-soft); padding: var(--space-14) var(--page-gutter); }\n.rz-strip { background: var(--signal-500); padding: var(--space-6) var(--page-gutter); font-size: 11px; color: var(--signal-ink); }\n.rz-strip__inner { max-width: var(--container); margin: 0 auto; display: flex; justify-content: space-between; gap: var(--space-13); flex-wrap: wrap; }\n\n<\u002Fstyle>\n<style>\n  body { padding: 0 40px 96px; }\n  .ds-wrap { max-width: 1000px; margin: 0 auto; }\n  .ds-grid { display: grid; gap: 16px; }\n  .ds-sw { display: flex; gap: 12px; flex-wrap: wrap; }\n  .ds-panel { background: var(--surface-card); border: 1px solid var(--border-strong); border-radius: var(--radius-xl); padding: 22px 24px; }\n  .ds-do { font-size: 12.5px; line-height: 1.75; color: var(--text-small); font-weight: 300; }\n  .ds-do b { color: var(--text-heading); font-weight: 600; }\n  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; background: var(--surface-sunken); border: 1px solid var(--border-row); border-radius: var(--radius-xs); padding: 1px 5px; color: var(--accent-text); }\n  .ds-toc a { display: block; font-size: 12.5px; padding: 5px 0; color: var(--ink-600); }\n  .ds-toc a:hover { color: var(--text-heading); }\n<\u002Fstyle>\n\n<\u002Fhead>\n\n<body class=\"rz-page\">\n<div class=\"ds-wrap\">\n\n<header style=\"padding:64px 0 40px\">\n  <div class=\"rz-wordmark\" style=\"margin-bottom:2px\">REALIZATION<\u002Fdiv>\n  <div class=\"rz-tagline\" style=\"margin-bottom:30px\">After you've tried everything else<\u002Fdiv>\n  <div class=\"rz-eyebrow rz-eyebrow--lg\" style=\"margin-bottom:22px\">Design system · full reference<\u002Fdiv>\n  <h1 class=\"rz-h1\" style=\"max-width:760px\">Every rule, token and component behind the capital-project-delays page.<\u002Fh1>\n  <p style=\"max-width:680px;margin:22px 0 0;font-size:14.5px;line-height:1.75;color:var(--text-body);font-weight:300;text-wrap:pretty\">This page is the single specification. Values are lifted from the live page rather than rounded to a grid: where the page says 13.5px, this system says 13.5px. Everything below is rendered with the real tokens in <code>styles.css<\u002Fcode>.<\u002Fp>\n  <div class=\"ds-toc\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:0 24px;margin-top:34px;border-top:1px solid var(--border-soft);padding-top:18px\">\n    <a href=\"#color\">01 Colour<\u002Fa><a href=\"#type\">02 Typography<\u002Fa><a href=\"#space\">03 Space &amp; layout<\u002Fa><a href=\"#shape\">04 Shape &amp; depth<\u002Fa>\n    <a href=\"#states\">05 States &amp; motion<\u002Fa><a href=\"#components\">06 Components<\u002Fa><a href=\"#patterns\">07 Page patterns<\u002Fa><a href=\"#content\">08 Content rules<\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n<section id=\"color\" style=\"padding:56px 0;border-top:1px solid var(--border-soft)\">\n  <div class=\"rz-eyebrow\" style=\"margin-bottom:12px\">01 · Colour<\u002Fdiv>\n  <h2 class=\"rz-h2\" style=\"max-width:660px;margin-bottom:26px\">Warm neutrals carry everything; two accents carry the argument.<\u002Fh2>\n  \n<div class=\"ds-grid\" style=\"gap:28px\">\n  <div>\n    <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"margin-bottom:14px\">Ink — all type comes from this ramp<\u002Fdiv>\n    <div class=\"ds-sw\">\n      <div style=\"min-width:132px\">\n  <div style=\"height:52px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--ink-900)\"><\u002Fdiv>\n  <div style=\"font-size:11px;font-weight:600;margin-top:7px;color:var(--text-heading)\">ink-900<\u002Fdiv>\n  <div style=\"font-size:10px;color:var(--text-meta);font-variant-numeric:tabular-nums\">#0E0D0A<\u002Fdiv>\n  <div style=\"font-size:10px;color:var(--text-meta)\">dark bands<\u002Fdiv>\n<\u002Fdiv>\n      <div style=\"min-width:132px\">\n  <div style=\"height:52px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--ink-800)\"><\u002Fdiv>\n  <div style=\"font-size:11px;font-weight:600;margin-top:7px;color:var(--text-heading)\">ink-800<\u002Fdiv>\n  <div style=\"font-size:10px;color:var(--text-meta);font-variant-numeric:tabular-nums\">#17160F<\u002Fdiv>\n  <div style=\"font-size:10px;color:var(--text-meta)\">headings, table head<\u002Fdiv>\n<\u002Fdiv>\n      <div style=\"min-width:132px\">\n  <div style=\"height:52px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--ink-600)\"><\u002Fdiv>\n  <div style=\"font-size:11px;font-weight ta);font-variant-numeric:tabular-nums\">#0E0D0A<\u002Fdiv>\n  \n<\u002Fdiv>\n      <div style=\"min-width:132px\">\n  <div style=\"height:52px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--border-soft)\"><\u002Fdiv>\n  <div style=\"font-size:11px;font-weight:600;margin-top:7px;color:var(--text-heading)\">border-soft<\u002Fdiv>\n  <div style=\"font-size:10px;color:var(--text-meta);font-variant-numeric:tabular-nums\">#E7E4DD<\u002Fdiv>\n  \n<\u002Fdiv>\n      <div style=\"min-width:132px\">\n  <div style=\"height:52px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--border-strong)\"><\u002Fdiv>\n  <div style=\"font-size:11px;font-weight:600;margin-top:7px;color:var(--text-heading)\">border-strong<\u002Fdiv>\n  <div style=\"font-size:10px;color:var(--text-meta);font-variant-numeric:tabular-nums\">#DFDCD4<\u002Fdiv>\n  \n<\u002Fdiv>\n      <div style=\"min-width:132px\">\n  <div style=\"height:52px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--border-row)\"><\u002Fdiv>\n  <div style=\"font-size:11px;font-weight:600;margin-top:7px;color:var(--text-heading)\">border-row<\u002Fdiv>\n  <div style=\"font-size:10px;color:var(--text-meta);font-variant-numeric:tabular-nums\">#EAE7E0<\u002Fdiv>\n  \n<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rz-grid-2\" style=\"gap:16px\">\n    <div>\n      <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"margin-bottom:14px\">Signal orange — light surfaces only<\u002Fdiv>\n      <div class=\"ds-sw\">\n        <div style=\"min-width:132px\">\n  <div style=\"height:52px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--accent-500)\"><\u002Fdiv>\n  <div style=\"font-size:11px;font-weight:600;margin-top:7px;color:var(--text-heading)\">accent-500<\u002Fdiv>\n  <div style=\"font-size:10px;color:var(--text-meta);font-variant-numeric:tabular-nums\">#E2521E<\u002Fdiv>\n  <div style=\" xt-align:center;font-size:11.5px;color:var(--text-small)\">White band — prose then cards<\u002Fdiv>\n  <div style=\"background:var(--surface-dark);padding:26px 16px;text-align:center;font-size:11.5px;color:var(--on-dark-68)\">Ink band — every third or fourth section, never two in a row<\u002Fdiv>\n  <div style=\"background:var(--surface-page);padding:26px 16px;text-align:center;font-size:11.5px;color:var(--text-small)\">Bone band — asymmetric split, sticky statement card<\u002Fdiv>\n  <div style=\"background:var(--surface-dark);padding:26px 16px;text-align:center;font-size:11.5px;color:var(--on-dark-68)\">Closing CTA band<\u002Fdiv>\n  <div style=\"background:var(--surface-card);padding:20px 16px;text-align:center;font-size:11.5px;color:var(--text-small)\">Footer<\u002Fdiv>\n  <div style=\"background:var(--signal-500);padding:14px 16px;text-align:center;font-size:11.5px;color:var(--signal-ink)\">Brand strip<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"shape\" style=\"padding:56px 0;border-top:1px solid var(--border-soft)\">\n  <div class=\"rz-eyebrow\" style=\"margin-bottom:12px\">04 · Shape &amp; depth<\u002Fdiv>\n  <h2 class=\"rz-h2\" style=\"max-width:660px;margin-bottom:26px\">Hairlines do the structural work. Two shadows exist.<\u002Fh2>\n  \n<div class=\"rz-grid-2\" style=\"gap:16px;margin-bottom:16px\">\n  <div>\n    <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"margin-bottom:14px\">Card shells<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n      <div class=\"rz-card--outline\"><div class=\"rz-card-title rz-card-title--sm\">Outline<\u002Fdiv><div class=\"rz-meta\" style=\"margin-top:6px\">10px · 1px #DFDCD4 · white · 22/24<\u002Fdiv><\u002Fdiv>\n      <div class=\"rz-card--sunken\"><div class=\"rz-card-title rz-card-title--sm\">Sunken<\u002Fdiv><div class=\"rz-meta\" style=\"margin-top:6px\">10px · #FBFAF8 on white bands<\u002Fdiv><\u002Fdiv>\n      <div class=\"rz-card--accent-edge\"><div class=\"rz-card-title rz-card-title--sm\">Accent edge<\u002Fdiv><div class=\"rz-meta\" style=\"margin-top:6px\">8px · 3px left accent-500<\u002Fdiv><\u002Fdiv>\n      <div class=\"rz-card rz-card--elevated\"><div class=\"rz-card-title rz-card-title--sm\">Elevated<\u002Fdiv><div class=\"rz-meta\" style=\"margin-top:6px\">12px · 0 18 50 rgba(23,22,15,.05)<\u002Fdiv><\u002Fdiv>\n      <div class=\"rz-card--statement\"><div class=\"rz-card-title rz-card-title--sm\" style=\"color:#fff\">Statement<\u002Fdiv><div style=\"font-size:10px;color:var(--on-dark-68);margin-top:6px\">10px · solid ink-900 · 28/26<\u002Fdiv><\u002Fdiv>\n      <div class=\"rz-card--on-dark\" style=\"background:var(--surface-dark)\"><div class=\"rz-card-title rz-card-title--sm\" style=\"color:var(--signal-500)\">On dark<\u002Fdiv><div style=\"font-size:10px;color:var(--on-dark-68);margin-top:6px\">white 5% fill · white 14% hairline<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ds-panel\">\n    <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"margin-bottom:16px\">Radii, rules, depth<\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Radius<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">4 status · 5 button · 6 dark button · 8 accent card · 10 card/table · 12 elevated · 999 tag<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Hairline<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">1px — border-soft / border-strong / border-row<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Accent edge<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">3px solid accent-500, left only<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Shadow (hero panel)<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">0 18px 50px rgba(23,22,15,.05)<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Shadow (accent panel)<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">0 20px 60px rgba(226,82,30,.08)<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Inner shadow / glow<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">none<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Blur / frosted glass<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">none — the sticky header is opaque white<\u002Fspan><\u002Fdiv>\n    <div class=\"ds-do\" style=\"margin-top:14px\"><b>Washes<\u002Fb> are the only gradients: the hero's orange 10% top-right plus green 12% left, and a single right-side orange glow on white.<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px\">\n      <div style=\"background:var(--wash-hero);border:1px solid var(--border-strong);border-radius:var(--radius-lg);height:74px\"><\u002Fdiv>\n      <div style=\"background:var(--wash-right);border:1px solid var(--border-strong);border-radius:var(--radius-lg);height:74px\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"states\" style=\"padding:56px 0;border-top:1px solid var(--border-soft)\">\n  <div class=\"rz-eyebrow\" style=\"margin-bottom:12px\">05 · States &amp; motion<\u002Fdiv>\n  <h2 class=\"rz-h2\" style=\"max-width:660px;margin-bottom:26px\">Colour shifts only. Nothing lifts, scales or glows.<\u002Fh2>\n  \n<div class=\"rz-grid-2\" style=\"gap:16px\">\n  <div class=\"ds-panel\">\n    <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"margin-bottom:16px\">Interactive states<\u002Fdiv>\n    <div style=\"display:grid;gap:12px\">\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><a class=\"rz-btn rz-btn--primary\" href=\"#states\">Primary<\u002Fa><span class=\"rz-btn rz-btn--primary\" style=\"background:var(--accent-600)\">hover<\u002Fspan><span class=\"rz-btn rz-btn--primary rz-btn--disabled\">disabled 45%<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><a class=\"rz-btn rz-btn--secondary\" href=\"#states\">Secondary<\u002Fa><span class=\"rz-btn rz-btn--secondary\" style=\"border-color:var(--accent-500)\">hover<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><a class=\"rz-btn rz-btn--dark\" href=\"#states\">Header CTA<\u002Fa><span class=\"rz-btn rz-btn--dark\" style=\"background:#000\">hover<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;align-items:center\"><a href=\"#states\" style=\"font-size:12.5px\">Inline link<\u002Fa><a href=\"#states\" style=\"font-size:12.5px;color:var(--accent-700)\">hover → accent-700<\u002Fa><span style=\"font-size:12.5px;color:var(--ink-600)\">Nav link<\u002Fspan><span style=\"font-size:12.5px;color:var(--text-heading)\">hover → ink-800<\u002Fspan><\u002Fdiv>\n      <div class=\"rz-accordion\" style=\"gap:7px\">\n        <div class=\"rz-accordion__item\"><div class=\"rz-accordion__summary\" style=\"background:var(--surface-sunken)\"><span class=\"rz-accordion__q\">Accordion row hover → surface-sunken<\u002Fspan><span class=\"rz-accordion__sign\">+<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"rz-accordion__item\"><div class=\"rz-accordion__summary\"><span class=\"rz-accordion__q\">Open row — sign rotates 45°<\u002Fspan><span class=\"rz-accordion__sign\" style=\"transform:rotate(45deg)\">+<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ds-panel\">\n    <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"margin-bottom:16px\">Motion budget<\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Transition<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">0.18s cubic-bezier(.4, 0, .2, 1)<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Properties animated<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">background-color · border-color · transform (accordion sign only)<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Entrance / scroll animation<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">none<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Parallax, counters, marquees<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">none<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Press state<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">none — no scale, no darken beyond hover<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-row);font-size:12px\">\n  <span style=\"color:var(--text-heading);font-weight:600\">Focus<\u002Fspan><span style=\"color:var(--text-small);font-variant-numeric:tabular-nums;text-align:right\">browser default outline; do not remove<\u002Fspan><\u002Fdiv>\n    <div class=\"ds-do\" style=\"margin-top:14px\"><b>Why so little.<\u002Fb> The pages are read top to bottom as an argument. Movement competes with reading, so the system spends its motion budget on one 45° rotation.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"components\" style=\"padding:56px 0;border-top:1px solid var(--border-soft)\">\n  <div class=\"rz-eyebrow\" style=\"margin-bottom:12px\">06 · Components<\u002Fdiv>\n  <h2 class=\"rz-h2\" style=\"max-width:660px;margin-bottom:26px\">Fifteen components, grouped by concern.<\u002Fh2>\n  \n<div class=\"ds-grid\" style=\"gap:16px\">\n  <div class=\"ds-panel\">\n    <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"margin-bottom:16px\">Core — Button · Tag · Eyebrow · SectionHeading<\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px\">\n      <a class=\"rz-btn rz-btn--primary\" href=\"#components\">Diagnose the delay pattern →<\u002Fa>\n      <a class=\"rz-btn rz-btn--secondary\" href=\"#components\">See the real problem<\u002Fa>\n      <a class=\"rz-btn rz-btn--dark\" href=\"#components\">Schedule a Discussion<\u002Fa>\n      <a class=\"rz-btn rz-btn--primary rz-btn--lg\" href=\"#components\">Closing CTA (lg)<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px\">\n      <span class=\"rz-tag\">Capital projects<\u002Fspan><span class=\"rz-tag\">EPC &amp; infrastructure<\u002Fspan><span class=\"rz-tag\">CPM limitations<\u002Fspan><span class=\"rz-tag\">WIP and cycle time<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"rz-eyebrow\" style=\"margin-bottom:12px\">Why busy projects get slower<\u002Fdiv>\n    <h2 class=\"rz-h2\" style=\"max-width:560px\">More work in progress does not automatically mean more progress.<\u002Fh2>\n    <div class=\"rz-meta\" style=\"margin-top:12px\">Button: 10/18px · sm 9/16 · lg 11/20. Tag: 6/14 pill. Eyebrow: accent · signal · muted.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ds-panel\">\n    <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"margin-bottom:16px\">Content — NumberedItem · InfoCard · StatusRow · DataTable · QuoteCard · Equation<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px 46px;margin-bottom:18px\">\n      <div style=\"display:flex;gap:14px\"><div class=\"rz-marker\">1<\u002Fdiv><div style=\"font-size:13px;line-height:1.7;color:var(--ink-600);font-weight:300\">Dates keep changing, but the final commitment remains under pressure.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:13px\"><div class=\"rz-marker rz-marker--sm\">2<\u002Fdiv><div><div class=\"rz-card-title rz-card-title--xs\">Persistent uncertainty<\u002Fdiv><div class=\"rz-fine\" style=\"margin-top:3px\">Approvals, rework and site conditions are the normal operating environment.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"rz-grid-3\" style=\"margin-bottom:18px\">\n      <div class=\"rz-card--sunken\"><div style=\"font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--accent-500);margin-bottom:10px\">01<\u002Fdiv><div class=\"rz-card-title\" style=\"margin-bottom:7px\">Many stakeholders<\u002Fdiv><div class=\"rz-small\">A delay in one group quietly becomes waiting time for another.<\u002Fdiv><\u002Fdiv>\n      <div class=\"rz-card--accent-edge\"><div class=\"rz-card-title\" style=\"margin-bottom:6px\">Work starts before it is truly ready.<\u002Fdiv><div class=\"rz-small\">The start date is protected, but flow is not.<\u002Fdiv><\u002Fdiv>\n      <div class=\"rz-card--statement\"><div class=\"rz-eyebrow rz-eyebrow--dark\" style=\"margin-bottom:14px\">The real issue<\u002Fdiv><div class=\"rz-statement\" style=\"color:#fff;font-size:19px\">Short of completed handovers.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"rz-grid-2\" style=\"margin-bottom:18px\">\n      <div class=\"rz-card--sunken\" style=\"padding:26px 28px\">\n        <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"margin-bottom:16px\">The hidden equation<\u002Fdiv>\n        <div class=\"rz-equation\" style=\"margin-bottom:16px\">TP = <em>WIP<\u002Fem> ÷ CT<\u002Fdiv>\n        <div class=\"rz-small\">If WIP rises but the system cannot finish faster, cycle time expands.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rz-card--outline\" style=\"display:grid;gap:7px;align-content:start\">\n        <div class=\"rz-status\"><span class=\"rz-status__label\">Civil front started<\u002Fspan><span class=\"rz-status__state\">drawing pending<\u002Fspan><\u002Fdiv>\n        <div class=\"rz-status\"><span class=\"rz-status__label\">Contractor mobilized<\u002Fspan><span class=\"rz-status__state\">access partial<\u002Fspan><\u002Fdiv>\n        <div class=\"rz-status\"><span class=\"rz-status__label\">Area handed over<\u002Fspan><span class=\"rz-status__state\">material short<\u002Fspan><\u002Fdiv>\n        <div class=\"rz-status\"><span class=\"rz-status__label\">Inspection called<\u002Fspan><span class=\"rz-status__state\">work incomplete<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"rz-table\" style=\"margin-bottom:18px\">\n      <div class=\"rz-table__row rz-table__head\"><div>What happens<\u002Fdiv><div>Why it costs the project time<\u002Fdiv><\u002Fdiv>\n      <div class=\"rz-table__row rz-table__row--odd\"><div class=\"rz-table__cell-key\">Approvals do not arrive in the sequence needed.<\u002Fdiv><div class=\"rz-table__cell-val\">Work waits, restarts, or moves to another front.<\u002Fdiv><\u002Fdiv>\n      <div class=\"rz-table__row rz-table__row--even\"><div class=\"rz-table__cell-key\">Progress measurement rewards starts.<\u002Fdiv><div class=\"rz-table__cell-val\">The project appears to progress, but handovers remain unfinished.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"rz-card--outline\" style=\"padding:28px 30px;max-width:620px\">\n      <div class=\"rz-quote__title\">Critical-Path Planning and Scheduling<\u002Fdiv>\n      <div class=\"rz-meta\" style=\"margin:6px 0 16px\">James E. Kelley Jr. and Morgan R. Walker<\u002Fdiv>\n      <div class=\"rz-quote\">Manpower and equipment considerations were <span class=\"rz-mark\">“conspicuous by their absence”<\u002Fspan>, and schedules could be feasible but <span class=\"rz-mark\">“not necessarily practical.”<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ds-panel\" style=\"padding:0;overflow:hidden\">\n    <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"padding:22px 24px 0\">Layout — SiteHeader · Section · Accordion · CTABand · SiteFooter<\u002Fdiv>\n    <header class=\"rz-header\" style=\"position:static;margin-top:16px\">\n      <div><div class=\"rz-wordmark\">REALIZATION<\u002Fdiv><div class=\"rz-tagline\">After you've tried everything else<\u002Fdiv><\u002Fdiv>\n      <nav class=\"rz-nav\"><a href=\"#components\">The delay loop<\u002Fa><a href=\"#components\">CPM limits<\u002Fa><a href=\"#components\">FAQ<\u002Fa><a class=\"rz-btn rz-btn--dark\" href=\"#components\">Schedule a Discussion<\u002Fa><\u002Fnav>\n    <\u002Fheader>\n    <div style=\"padding:22px 24px\">\n      <div class=\"rz-accordion\">\n        <details class=\"rz-accordion__item\" open=\"\">\n          <summary class=\"rz-accordion__summary\"><span class=\"rz-accordion__q\">Is project delay mainly a software problem?<\u002Fspan><span class=\"rz-accordion__sign\">+<\u002Fspan><\u002Fsummary>\n          <div class=\"rz-accordion__a\">No. Software can improve visibility, reporting, collaboration, dashboards and alerts. But if work starts before readiness, software will only show the delay faster.<\u002Fdiv>\n        <\u002Fdetails>\n        <details class=\"rz-accordion__item\">\n          <summary class=\"rz-accordion__summary\"><span class=\"rz-accordion__q\">What is WIP in a capital project?<\u002Fspan><span class=\"rz-accordion__sign\">+<\u002Fspan><\u002Fsummary>\n          <div class=\"rz-accordion__a\">All the work that has been started but not finished.<\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <section style=\"background:var(--surface-dark);color:#fff;padding:34px 24px\">\n      <div style=\"display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center\">\n        <div><div class=\"rz-eyebrow rz-eyebrow--dark\" style=\"margin-bottom:14px\">Talk to us<\u002Fdiv><div style=\"font-family:var(--font-display);font-size:24px;line-height:1.22;letter-spacing:-.025em;font-weight:700\">Before choosing another tool, ask what problem you are solving.<\u002Fdiv><\u002Fdiv>\n        <div><p style=\"margin:0 0 20px;font-size:13px;line-height:1.8;color:var(--on-dark-68);font-weight:300\">Software will only show the delay faster. It will not remove the execution behaviour creating the delay.<\u002Fp><a class=\"rz-btn rz-btn--primary rz-btn--lg\" href=\"#components\">Diagnose the delay pattern →<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <footer class=\"rz-footer\" style=\"padding:26px 24px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:40px;flex-wrap:wrap\">\n        <div><div class=\"rz-wordmark\" style=\"font-size:14px;letter-spacing:var(--track-wordmark-sm)\">REALIZATION®<\u002Fdiv><div style=\"font-size:11.5px;color:var(--ink-300);margin-top:8px\">Critical Chain Project Management consulting and implementation<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:right;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-meta);line-height:1.7\">After you’ve tried<br>everything else<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n    <div class=\"rz-strip\" style=\"padding:14px 24px\"><div class=\"rz-strip__inner\" style=\"max-width:none\"><div>REALIZATION® | After You’ve Tried Everything Else<\u002Fdiv><div>www.realizationindia.com<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"patterns\" style=\"padding:56px 0;border-top:1px solid var(--border-soft)\">\n  <div class=\"rz-eyebrow\" style=\"margin-bottom:12px\">07 · Page patterns<\u002Fdiv>\n  <h2 class=\"rz-h2\" style=\"max-width:660px;margin-bottom:26px\">How a page is assembled, band by band.<\u002Fh2>\n  \n<div class=\"rz-table\">\n  <div class=\"rz-table__row rz-table__head\"><div>Band<\u002Fdiv><div>Contents and rules<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">Sticky header<\u002Fdiv><div class=\"rz-table__cell-val\">White, hairline bottom border. Stacked wordmark + 7.5px tagline left; 4–6 sentence-case text links and exactly one ink CTA right.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">Hero<\u002Fdiv><div class=\"rz-table__cell-val\">Ambient wash, centred, max 830px. Eyebrow (10.5px) → 46px question headline → one or two 14.5px paragraphs → primary + secondary button → 3–5 topic tags.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">Symptoms panel<\u002Fdiv><div class=\"rz-table__cell-val\">Elevated 12px card overlapping the hero, 56px below it. Eyebrow, 19px lead, then numbered items in two columns at gap 20px 46px.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">Prose + cards<\u002Fdiv><div class=\"rz-table__cell-val\">White band. Eyebrow, 27px claim, two or three paragraphs at 820px, then a 3-up of sunken 01/02/03 cards.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">Dark process band<\u002Fdiv><div class=\"rz-table__cell-val\">Ink. Two paragraphs at 75% / 62% white, then a 5-up of translucent cards with yellow numbered discs.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">Sticky statement<\u002Fdiv><div class=\"rz-table__cell-val\">Bone band, 0.85/1.15 split. Ink statement card sticks at 90px on the left; prose plus orange-edge cards scroll on the right.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">Evidence pair<\u002Fdiv><div class=\"rz-table__cell-val\">Two cards side by side — one carrying a figure or equation, one carrying the list it explains, each closing with a 12.5px summary line.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">Citation<\u002Fdiv><div class=\"rz-table__cell-val\">Bone band, 0.9/1.1 split. Georgia citation card left, eyebrow + 26px heading + prose right. Quoted phrases take the yellow wash.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">Cause / consequence table<\u002Fdiv><div class=\"rz-table__cell-val\">White band. Ink header, zebra rows, Manrope-bold key cell left, light explanation right. Six rows is typical.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">Symptom checklist<\u002Fdiv><div class=\"rz-table__cell-val\">Ink band. Four cards with yellow titles at 14px and 68% white body copy.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">FAQ<\u002Fdiv><div class=\"rz-table__cell-val\">Bone band, 880px column, centred intro. 7 rows, first open, one open at a time.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">Closing CTA<\u002Fdiv><div class=\"rz-table__cell-val\">Ink, 70px padding, 1.05/0.95 split. Yellow eyebrow + 26px heading left; paragraph + one orange button right. One per page.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;border-top:1px solid var(--border-row)\">\n  <div class=\"rz-table__cell-key\">Footer + strip<\u002Fdiv><div class=\"rz-table__cell-val\">White footer with wordmark, descriptor and uppercase note; yellow strip beneath with brand line and URL. Always shipped together.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ds-panel ds-do\" style=\"margin-top:16px\">\n  <b>Sequence rules.<\u002Fb>\n  <div style=\"margin-top:8px\">Bands alternate bone → white, with an ink band roughly every third or fourth section and never two in a row.<\u002Fdiv>\n  <div style=\"margin-top:6px\">Every band opens with an eyebrow. No band opens with a bare heading.<\u002Fdiv>\n  <div style=\"margin-top:6px\">Prose comes before cards; cards summarise what the prose argued, never replace it.<\u002Fdiv>\n  <div style=\"margin-top:6px\">One primary action per band, two at most on the hero. Nothing is sold before the closing band.<\u002Fdiv>\n  <div style=\"margin-top:6px\">No imagery, no icons, no logos of customers, no statistics that were not given.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"content\" style=\"padding:56px 0;border-top:1px solid var(--border-soft)\">\n  <div class=\"rz-eyebrow\" style=\"margin-bottom:12px\">08 · Content rules<\u002Fdiv>\n  <h2 class=\"rz-h2\" style=\"max-width:660px;margin-bottom:26px\">Diagnostic, third person, full sentences.<\u002Fh2>\n  \n<div class=\"rz-grid-2\" style=\"gap:16px\">\n  <div class=\"ds-panel ds-do\">\n    <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"margin-bottom:14px\">Do<\u002Fdiv>\n    <div><b>Write headings as complete sentences.<\u002Fb> \"More work in progress does not automatically mean more progress.\"<\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>Open the page with the reader's question.<\u002Fb> H1 is interrogative; H2s are claims.<\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>Name the section's move in the eyebrow.<\u002Fb> \"The false comfort\", \"The delay loop\".<\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>Stay in third person.<\u002Fb> The project, the team, management, leadership.<\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>Use short declaratives in runs.<\u002Fb> \"A drawing comes late. A vendor changes commitment.\"<\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>Answer with the verdict first.<\u002Fb> \"No. Software can improve visibility…\"<\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>Keep the vocabulary exact.<\u002Fb> WIP, cycle time, throughput, front, handover, readiness, switching.<\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>Use sentence case<\u002Fb> everywhere except eyebrows, table heads, the wordmark and the footer note.<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ds-panel ds-do\">\n    <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"margin-bottom:14px\">Don't<\u002Fdiv>\n    <div><b>No emoji, no exclamation marks.<\u002Fb><\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>No invented numbers.<\u002Fb> No percentages, ROI figures or client counts unless supplied.<\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>No \"we\".<\u002Fb> The brand appears in the wordmark, footer and mailto only.<\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>No consulting filler.<\u002Fb> Transformation, synergy, best-in-class, world-class, unlock.<\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>No title case headings, no colons as subtitles.<\u002Fb><\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>No blame.<\u002Fb> Recovery behaviour is called understandable before it is called costly.<\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>No testimonials, awards or customer logos.<\u002Fb><\u002Fdiv>\n    <div style=\"margin-top:10px\"><b>Two CTA labels only:<\u002Fb> \"Schedule a Discussion\" and \"Diagnose the delay pattern →\".<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ds-panel\" style=\"margin-top:16px\">\n  <div class=\"rz-eyebrow rz-eyebrow--muted\" style=\"margin-bottom:14px\">Marks in use<\u002Fdiv>\n  <div style=\"display:flex;gap:34px;flex-wrap:wrap;font-size:13px;color:var(--text-small);font-weight:300\">\n    <div><span style=\"font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text-heading)\">→<\u002Fspan> &nbsp;trailing a primary button label<\u002Fdiv>\n    <div><span style=\"font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text-heading)\">÷<\u002Fspan> &nbsp;in the throughput equation<\u002Fdiv>\n    <div><span style=\"font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text-heading)\">+<\u002Fspan> &nbsp;accordion, rotated 45° when open<\u002Fdiv>\n    <div><span style=\"font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text-heading)\">®<\u002Fspan> &nbsp;after the footer wordmark<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rz-meta\" style=\"margin-top:14px\">These four characters are the entire non-alphabetic vocabulary. The system uses no icon set: structure is carried by numbered discs, 3px colour edges and zebra rows.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"padding:56px 0 0;border-top:1px solid var(--border-soft);display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap\">\n  <div>\n    <div class=\"rz-wordmark\" style=\"font-size:14px;letter-spacing:var(--track-wordmark-sm)\">REALIZATION®<\u002Fdiv>\n    <div style=\"font-size:11.5px;color:var(--ink-300);margin-top:8px\">Design system reference · tokens in <code>styles.css<\u002Fcode> · components in <code>components/<\u002Fcode> · page recreation in <code>ui_kits/problem_page/<\u002Fcode><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"text-align:right;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-meta);line-height:1.7\">After you’ve tried<br>everything else<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
